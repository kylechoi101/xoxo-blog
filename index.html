<script type="application/json" id="state">{"title": "I played on Apple’s Playground so You don’t have to", "dek": "I spent the whole of September inside Apple’s new Image Playground. Here is what came out.", "by": "Kyle Choi · September 2026", "sections": [{"h": "The first day", "p": "First, I generated avatars. An avatar is a mini version of you, so it has to carry all of your facial features. I drew seven facial types and checked whether Playground honored each one.", "cap0": "", "cap1": ""}, {"h": "Moods", "p": "Next, I wanted to see whether the avatars could be altered by mood keywords. At first I just said “make it look hungry”, but Apple clearly had a different vision from mine. I also needed them to be kawaii. So I reversed the process: I had Gemini draw a reference image for each mood, had Claude describe that picture, and used the description as the keyword for the mood tile.", "cap0": "Hungry, as Gemini imagined it", "cap1": "Playground’s take on the same brief"}, {"h": "First phone rounds", "p": "Then I checked whether the prompts survived on a real iPhone running an iOS close to release. As you can see, anything involving hands gave me problems. I also realized that Playground keeps the shape of the original picture, square or rectangular. My app goes square to rectangle.", "cap0": "The avatar, iOS 27 beta 8", "cap1": "Celebrating. Hands are the hard part"}, {"h": "A/B prompts", "p": "I tweaked the phrasing a bit more to see which wording survives a reliable regeneration cycle.", "cap0": "Prompt sent as text", "cap1": "Same prompt, hidden behind a title"}, {"h": "Realistic photos", "p": "I wanted to see whether the prompts held up on more realistic photos, not just portraits.", "cap0": "From a real-looking photo", "cap1": "The same person, love you"}, {"h": "Scoring against the reference", "p": "The results were getting better by then, so I built a scoring system to track the likeness and the kawaii-ness of each result.", "cap0": "Body clause last: a head", "cap1": "Body clause first: the whole body, 3 of 3"}, {"h": "Avatar labs", "p": "The real iOS 27 turned out a bit different from the betas. In the background it rewrites the prompt for its own on-device or Private Cloud Compute model. I had to find out which prompts survive the rewrite.", "cap0": "The shipped prompt", "cap1": "Same words, after “The same person as in the picture”"}, {"h": "All 54 through the app", "p": "Every mood redrawn from the avatar, on the phone, in one night.", "cap0": "Nostalgic, shipping prompt", "cap1": "Nostalgic, copying the reference"}, {"h": "Two phones, two iOS", "p": "iOS 26 has a Playground problem. If a user has not updated to iOS 27 yet, Playground draws glossy, unsettling 3D. iOS 27 draws flat kawaii characters. It was a hard bargain.", "cap0": "iPhone 17, iOS 26.6", "cap1": "iPhone 16, iOS 27. Same photo, same prompt"}, {"h": "Variance", "p": "A one-to-one comparison between an iPhone 15 Pro Max and an iPhone 18 Pro Max.", "cap0": "iPhone 15 Pro Max", "cap1": "iPhone 18 Pro Max, anime eyes"}, {"h": "Apple’s new features", "p": "I tested the personalization and variety options. Minor drawbacks, no real improvement.", "cap0": "With “large sparkling”", "cap1": "Without it. Two words did what the knobs could not"}, {"h": "Reading the photo", "p": "I let Apple’s on-device model read the photo and write the feature keywords itself. This is still in research.", "cap0": "The model said brown hair", "cap1": "The model said black hair. Same photo"}], "numbersTitle": "The numbers behind the pictures", "numbersLead": "Every score is a Vision feature-print distance or a blind 1-to-5 rubric, straight from the lab files. Hover any mark.", "end": "Scores are Vision feature-print distances; smaller is more alike. Every drawing, round by round, is in the XOXO Drawing Archive."}</script>
